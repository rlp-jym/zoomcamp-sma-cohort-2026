name: index-breadth-momentum-tests

on:
  push:
    paths: ["index-breadth-momentum/**"]
  pull_request:
    paths: ["index-breadth-momentum/**"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Data (EDGAR parquet, prices) is gitignored, so data-dependent tests skip here.
      # The reconciliation budget runs in full after `breadth.edgar` + `breadth.prices`.
      - run: uv run --with pytest pytest -q
        working-directory: index-breadth-momentum
