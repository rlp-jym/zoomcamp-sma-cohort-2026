name: pipeline

on:
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: crypto-cross-pred

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No-op until the CLI exists (P6-01). Avoids a nightly red build.
      - name: Is the pipeline built?
        id: ready
        run: |
          if [ -f pyproject.toml ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Pipeline not built yet — skipping (see P6-01)."
          fi

      - uses: astral-sh/setup-uv@v6
        if: steps.ready.outputs.ready == 'true'
        with:
          enable-cache: true

      - name: Install
        if: steps.ready.outputs.ready == 'true'
        run: uv sync --all-groups

      - name: Run pipeline
        if: steps.ready.outputs.ready == 'true'
        run: uv run python -m crypto_cross_pred.cli all --source binance
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: ${{ secrets.HF_DATASET_REPO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
