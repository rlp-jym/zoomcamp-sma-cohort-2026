name: ci

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # One environment for the whole workspace (root + crypto-cross-pred).
      - name: Install
        run: uv sync --all-packages --all-groups

      - name: Lint
        run: uv run ruff check crypto-cross-pred

      - name: Test
        run: uv run pytest crypto-cross-pred/tests -q
