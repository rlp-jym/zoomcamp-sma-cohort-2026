[project]
name = "zoomcamp-sma-cohort-2026"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "gdown>=6.4.0",
    "jupyterlab>=4.6.3",
    "lxml>=6.1.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pandas-datareader>=0.11.1",
    "plotly>=7.1.0",
    "scikit-learn>=1.9.1",
    "statsmodels>=0.15.0",
    "tqdm>=4.70.1",
    "yfinance>=1.7.0",
]

# One environment and one lockfile for the whole repo. Homework notebooks and
# `crypto-cross-pred/` share the root `.venv`; the member keeps its own
# pyproject.toml for its dependency list.
[tool.uv.workspace]
members = ["crypto-cross-pred"]
